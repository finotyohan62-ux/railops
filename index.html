<script id="railops-fix-step1-import">
/* RailOps v132 — ETAPE 1 : fiabilisation du lecteur de registres.
   Ne modifie PAS la purge hebdomadaire ni le cycle de vérification. */
(function(){
  'use strict';
  const RAILOPS_IMPORT_FIX_VERSION='132-step1';

  function roTxt(v){
    return String(v ?? '').trim().toLowerCase().normalize('NFD')
      .replace(/[\u0300-\u036f]/g,'')
      .replace(/[‐‑‒–—−]/g,'-')
      .replace(/[°º]/g,'o')
      .replace(/[_\\/.:-]+/g,' ')
      .replace(/\s+/g,' ')
      .trim();
  }

  function roHeaderKind(v){
    const h=roTxt(v), c=h.replace(/\s+/g,'');
    if(!h) return null;

    if(
      /^(ref|refs|reference|references|id|identifiant|identifiants|numero|num|no|n|code|matricule)$/.test(c) ||
      /^(id|identifiant|numero|num|no|n|code)(materiel|article|equipement|outil)$/.test(c) ||
      /^(materiel|article|equipement|outil)(id|numero|num|no|n|code)$/.test(c) ||
      h.includes('reference materiel') || h.includes('reference article') ||
      h.includes('identifiant materiel') || h.includes('numero materiel') ||
      h.includes('no materiel') || h.includes('code materiel')
    ) return 'ref';

    if(h.includes('designation') || h.includes('libelle') || h==='nom' || h.includes('nom article') ||
       h.includes('description') || h==='article' || h==='materiel' || h==='equipement' || h==='outil') return 'name';

    if(h.includes('categorie') || h==='cat' || h==='type' || h.includes('famille') || h.includes('groupe')) return 'cat';

    if(h.includes('echeance') || h.includes('expiration') || h.includes('validite') || h.includes('date limite') ||
       h.includes('prochaine verification') || h.includes('date verification') || h==='date') return 'date';

    if(h==='prix' || h.includes('prix unitaire') || h.includes('cout') || h.includes('tarif') || h==='euro' || h==='euros') return 'price';
    return null;
  }

  function roNormalizeRef(v){
    return String(v ?? '')
      .normalize('NFKC')
      .trim()
      .toUpperCase()
      .replace(/[‐‑‒–—−]/g,'-')
      .replace(/\s+/g,'')
      .replace(/[^A-Z0-9._\/-]/g,'-')
      .replace(/-{2,}/g,'-')
      .replace(/^-+|-+$/g,'');
  }

  function roLooksLikeRef(v){
    const raw=String(v ?? '').trim();
    if(!raw || raw.length>80) return false;
    if(/^[📍📦↩]/u.test(raw)) return false;
    if(/^\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}$/.test(raw)) return false;
    if(/^\d{4}-\d{2}-\d{2}/.test(raw)) return false;
    const n=roNormalizeRef(raw);
    if(!n || n.length>60) return false;
    if(!/[0-9]/.test(n) && !/[\/_-]/.test(n)) return false;
    return true;
  }

  function roAnalyzeRows(rows){
    const data=Array.isArray(rows)?rows:[];
    let best={score:-1,headerIdx:-1,refCol:-1,nameCol:-1,catCol:-1,dateCol:-1,priceCol:-1};
    const limit=Math.min(25,data.length);

    for(let r=0;r<limit;r++){
      const row=Array.isArray(data[r])?data[r]:[];
      const kinds=row.map(roHeaderKind);
      const refCol=kinds.indexOf('ref');
      const nameCol=kinds.indexOf('name');
      const catCol=kinds.indexOf('cat');
      const dateCol=kinds.indexOf('date');
      const priceCol=kinds.indexOf('price');
      const recognized=kinds.filter(Boolean).length;
      const score=(refCol>=0?6:0)+(nameCol>=0?2:0)+(catCol>=0?1:0)+(dateCol>=0?1:0)+(priceCol>=0?1:0)+recognized;
      if(refCol>=0 && score>best.score) best={score,headerIdx:r,refCol,nameCol,catCol,dateCol,priceCol};
    }

    if(best.refCol>=0) return best;

    // Secours : si les intitulés sont atypiques, repère la colonne qui ressemble le plus à des références.
    let maxCols=0;
    data.slice(0,80).forEach(r=>{ if(Array.isArray(r)) maxCols=Math.max(maxCols,r.length); });
    let bestCol=-1,bestRatio=0,bestCount=0;
    for(let c=0;c<maxCols;c++){
      let nonEmpty=0,refs=0;
      for(let r=0;r<Math.min(data.length,80);r++){
        const v=Array.isArray(data[r])?data[r][c]:'';
        if(String(v??'').trim()){
          nonEmpty++;
          if(roLooksLikeRef(v)) refs++;
        }
      }
      const ratio=nonEmpty?refs/nonEmpty:0;
      if(refs>=2 && (ratio>bestRatio || (ratio===bestRatio && refs>bestCount))){bestRatio=ratio;bestCount=refs;bestCol=c;}
    }
    if(bestCol>=0 && bestRatio>=0.55){
      return {score:0,headerIdx:-1,refCol:bestCol,nameCol:-1,catCol:-1,dateCol:-1,priceCol:-1};
    }
    return best;
  }

  function roFormatDate(v){
    if(v===null || v===undefined || v==='') return '';
    if(v instanceof Date && !isNaN(v)) return v.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'});
    if(typeof v==='number' && v>1000){
      const d=new Date(Date.UTC(1899,11,30)+v*86400000);
      return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'UTC'});
    }
    return String(v).trim();
  }

  function roParseRows(rows,chantierId){
    const a=roAnalyzeRows(rows);
    if(a.refCol<0) return [];
    const start=a.headerIdx>=0?a.headerIdx+1:0;
    const byId=new Map();

    for(let r=start;r<rows.length;r++){
      const row=Array.isArray(rows[r])?rows[r]:[];
      const rawRef=String(row[a.refCol] ?? '').trim();
      if(!rawRef || /^[📍📦↩]/u.test(rawRef)) continue;
      // v143 : les lignes de séparation du registre (ex. "PERCHE 4NRJ BAMBOU (20 articles)")
      // ne sont jamais des références. On ne les ignore que si les autres colonnes sont vides.
      const otherCells=row.filter((_,idx)=>idx!==a.refCol).map(v=>String(v??'').trim());
      const isSectionTitle=/^.+\(\s*\d+\s+articles?\s*\)\s*$/i.test(rawRef) && otherCells.every(v=>!v);
      if(isSectionTitle) continue;
      const id=roNormalizeRef(rawRef);
      if(!id) continue;

      const rawName=a.nameCol>=0?String(row[a.nameCol] ?? '').trim():'';
      const name=(rawName || rawRef).replace(/[^\x20-\x7E\u00C0-\u017E]/g,'?');
      const cat=a.catCol>=0 && String(row[a.catCol]??'').trim()?String(row[a.catCol]).trim():'Outillage';
      const echeance=a.dateCol>=0?roFormatDate(row[a.dateCol]):'';
      let prix=null;
      if(a.priceCol>=0 && row[a.priceCol]!=='' && row[a.priceCol]!==undefined){
        const p=parseFloat(String(row[a.priceCol]).replace(/[^\d.,-]/g,'').replace(',','.'));
        if(!isNaN(p)) prix=p;
      }

      const item={id,nom:name,cat,chantierId,etat:'inconnu',scan:null,presence:'non-confirme',echeance:echeance||'',prix,verifLundi:null,verifSemaine:null,controle2m:null};
      if(!byId.has(id)) byId.set(id,item);
      else {
        // Doublon dans le même registre : conserve une seule référence et complète les champs manquants.
        const old=byId.get(id);
        if((!old.nom || old.nom===old.id) && item.nom) old.nom=item.nom;
        if((!old.cat || old.cat==='Outillage') && item.cat) old.cat=item.cat;
        if(!old.echeance && item.echeance) old.echeance=item.echeance;
        if(old.prix==null && item.prix!=null) old.prix=item.prix;
      }
    }
    return [...byId.values()];
  }

  function roPrepareRowsForLegacy(rows){
    const a=roAnalyzeRows(rows);
    if(a.refCol<0) return rows;
    const start=a.headerIdx>=0?a.headerIdx+1:0;
    let cols=Math.max(a.refCol,a.nameCol,a.catCol,a.dateCol,a.priceCol,0)+1;
    rows.slice(start,start+30).forEach(r=>{if(Array.isArray(r)) cols=Math.max(cols,r.length);});
    const header=new Array(cols).fill('');
    header[a.refCol]='Référence';
    if(a.nameCol>=0) header[a.nameCol]='Désignation';
    if(a.catCol>=0) header[a.catCol]='Catégorie';
    if(a.dateCol>=0) header[a.dateCol]='Échéance';
    if(a.priceCol>=0) header[a.priceCol]='Prix';

    const out=[header];
    for(let r=start;r<rows.length;r++){
      const row=Array.isArray(rows[r])?[...rows[r]]:[];
      if(a.refCol<row.length || row[a.refCol]!==undefined) row[a.refCol]=roNormalizeRef(row[a.refCol]);
      out.push(row);
    }
    return out;
  }

  // 1) Même normalisation pour l'import simple/CSV/XLSX à un seul onglet.
  if(typeof processRows==='function'){
    const originalProcessRows=processRows;
    processRows=async function(rows){
      const prepared=roPrepareRowsForLegacy(Array.isArray(rows)?rows:[]);
      return originalProcessRows(prepared);
    };
  }

  // 2) Lecteur multi-onglets robuste : ne dépend plus uniquement d'un en-tête commençant par "Réf".
  parseOnglet=function(sheetInfo,chantierId){
    const rows=sheetInfo && Array.isArray(sheetInfo.rows)?sheetInfo.rows:[];
    const parsed=roParseRows(rows,chantierId);
    console.info('[RailOps import v132]',sheetInfo?.sn||'onglet',':',parsed.length,'référence(s) lue(s)');
    return parsed;
  };

  // 3) Lecture XLSX/CSV : conserve les zéros initiaux et calcule le vrai nombre de références par onglet.
  importCSV=function(input){
    const file=input?.files?.[0];
    if(!file) return;
    const ext=(file.name.split('.').pop()||'').toLowerCase();
    input.value='';
    if(ext==='pdf'){toast('Import PDF non supporté','warn');return;}
    if(typeof XLSX==='undefined'){toast('Bibliothèque XLSX indisponible','danger');return;}

    const handleWorkbook=(wb)=>{
      try{
        const skip=(typeof SKIP_TABS!=='undefined' && Array.isArray(SKIP_TABS))?SKIP_TABS:[];
        const sheetNames=wb.SheetNames.filter(name=>{
          if(skip.includes(String(name).toUpperCase().trim())) return false;
          const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:'',raw:false,dateNF:'dd/mm/yyyy',blankrows:false});
          return rows.some(row=>Array.isArray(row)&&row.some(v=>String(v??'').trim()));
        });
        if(!sheetNames.length){toast('Aucun onglet exploitable trouvé','danger');return;}

        if(sheetNames.length===1){
          const rows=XLSX.utils.sheet_to_json(wb.Sheets[sheetNames[0]],{header:1,defval:'',raw:false,dateNF:'dd/mm/yyyy',blankrows:false});
          processRows(rows);
          return;
        }

        const infos=sheetNames.map(name=>{
          const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:'',raw:false,dateNF:'dd/mm/yyyy',blankrows:false});
          const a=roAnalyzeRows(rows);
          const artCount=roParseRows(rows,'__preview__').length;
          return {sn:name,rows,headerIdx:a.headerIdx,artCount};
        });
        openImportMultiModal(infos,file.name);
      }catch(err){
        console.error('[RailOps import v132]',err);
        toast('Erreur lecture registre : '+(err?.message||err),'danger');
      }
    };

    if(['xlsx','xls','xlsm','xlsb','ods'].includes(ext)){
      const reader=new FileReader();
      reader.onload=e=>{
        try{handleWorkbook(XLSX.read(e.target.result,{type:'array',cellDates:true}));}
        catch(err){toast('Erreur lecture Excel : '+(err?.message||err),'danger');}
      };
      reader.onerror=()=>toast('Erreur de lecture du fichier','danger');
      reader.readAsArrayBuffer(file);
      return;
    }

    // CSV/TXT : XLSX gère correctement les champs entre guillemets et séparateurs inclus dans le texte.
    const reader=new FileReader();
    reader.onload=e=>{
      try{handleWorkbook(XLSX.read(e.target.result,{type:'string',raw:false}));}
      catch(err){toast('Erreur lecture CSV : '+(err?.message||err),'danger');}
    };
    reader.onerror=()=>toast('Erreur de lecture du fichier','danger');
    reader.readAsText(file,'utf-8');
  };

  window.RailOpsImportFix={version:RAILOPS_IMPORT_FIX_VERSION,analyze:roAnalyzeRows,normalizeReference:roNormalizeRef,parseRows:roParseRows};
  console.info('[RailOps] Correctif import étape 1 actif —',RAILOPS_IMPORT_FIX_VERSION);
})();
</script>

<script id="railops-v140-clean-engine">
/* RailOps v140 — base propre v132 + moteur unique multi-chantier
   - 1 seule occurrence par référence métier et par chantier/sous-chantier
   - même référence autorisée sur plusieurs chantiers
   - import DPI: INVENTAIRE = source de vérité
   - dédoublonnage contrôlé des doublons techniques existants
   - aucune modification de la purge hebdomadaire des vérifications
*/
(function(){
'use strict';
const VERSION='140-clean-multichantier';
const MC='__MC__';
let seq=0;

function normRef(v){
  if(window.RailOpsImportFix?.normalizeReference) return window.RailOpsImportFix.normalizeReference(v);
  return String(v??'').normalize('NFKC').trim().toUpperCase()
    .replace(/[‐‑‒–—−]/g,'-').replace(/\s+/g,'')
    .replace(/[^A-Z0-9._\/-]/g,'-').replace(/-{2,}/g,'-').replace(/^-+|-+$/g,'');
}
function looksRef(v){
  const r=normRef(v); if(!r||r.length>100)return false;
  if(/ARTICLE|ARTICLES/.test(r))return false;
  return /\d/.test(r)||/[-_/.]/.test(r);
}
function businessRef(m){
  if(!m)return '';
  if(m.reference&&looksRef(m.reference))return normRef(m.reference);
  const id=String(m.id||'');
  const p=id.lastIndexOf(MC); if(p>0)return normRef(id.slice(0,p));
  const nid=normRef(id), nnom=normRef(m.nom);
  if(looksRef(nnom)&&nid!==nnom&&nid.startsWith(nnom+'-')&&/^\d{1,5}$/.test(nid.slice(nnom.length+1)))return nnom;
  return nid;
}
function siteKey(v){return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,'');}
function canonSite(v){
  const k=siteKey(v);
  const map={ROISSY:'ROISSY',VEMARS:'VEMARS',PRA152:'PRA 152',GCP:'GCP',CONTAINER:'CONTAINER-01',CONTAINER01:'CONTAINER-01',RETOUR:'RETOUR',RETOURS:'RETOUR',NONAFFECTE:'NON AFFECTÉ',NONAFFECTEE:'NON AFFECTÉ'};
  return map[k]||String(v??'').trim().toUpperCase();
}
function parentIdOf(cid){const c=(S.chantiers||[]).find(x=>x.id===cid);return c?.parent_id||null;}
function topMasterId(cid){let c=(S.chantiers||[]).find(x=>x.id===cid);if(!c)return cid;while(c?.parent_id){const p=(S.chantiers||[]).find(x=>x.id===c.parent_id);if(!p)break;c=p;}return c?.id||cid;}
function pathOf(cid){const c=(S.chantiers||[]).find(x=>x.id===cid);if(!c)return cid||'Chantier inconnu';const p=c.parent_id?(S.chantiers||[]).find(x=>x.id===c.parent_id):null;return p?`${p.nom} › ${c.nom}`:(c.nom||cid);}
function direct(ref,cid,arr=S.mat||[]){const r=normRef(ref);return arr.find(m=>m.chantierId===cid&&businessRef(m)===r)||null;}
function allByRef(ref,arr=S.mat||[]){const r=normRef(ref);return arr.filter(m=>businessRef(m)===r);}
function cleanDb(m){return {id:m.id,nom:m.nom||'',cat:m.cat||'Outillage',chantierId:m.chantierId,etat:m.etat||'inconnu',scan:m.scan||null,presence:m.presence||'non-confirme',echeance:m.echeance||'',verifLundi:m.verifLundi||null,verifSemaine:m.verifSemaine||null,controle2m:m.controle2m||null};}
async function fetchRows(){if(typeof fetchAllMats==='function'){const r=await fetchAllMats();if(!r?.error&&Array.isArray(r?.data))return r.data;}return (S.mat||[]).slice();}
async function blockedIds(){const s=new Set();try{for(const id of (typeof getDeleteQueue==='function'?getDeleteQueue():[])||[])if(id)s.add(String(id));}catch(e){}try{const {data,error}=await db.from('deleted_ids').select('*');if(!error)for(const x of data||[]){const id=String(x?.id||x?.identifiant||'').trim();if(id)s.add(id);}}catch(e){}return s;}
function hash(v){let h=2166136261;for(const ch of String(v??'')){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}return (h>>>0).toString(36).toUpperCase();}
function stableTechId(ref,cid,used,blocked){
  const base=normRef(ref).slice(0,82);let salt=0,id='';
  do{id=`${base}${MC}${hash(cid+(salt?'#'+salt:''))}`.slice(0,120);salt++;}while(used.has(id)||blocked.has(id));
  used.add(id);return id;
}
function score(m){return (m?.scan?8:0)+(m?.verifLundi?6:0)+(m?.verifSemaine?6:0)+(m?.controle2m?4:0)+(m?.presence==='confirme'?3:0)+(m?.etat&&m.etat!=='inconnu'?2:0);}
function newerObj(a,b){if(!a)return b||null;if(!b)return a;const da=new Date(a.date||0).getTime()||0,dbb=new Date(b.date||0).getTime()||0;return dbb>da?b:a;}
function mergedKeeper(keeper,group){
  const out={...keeper};
  for(const m of group){
    if(!out.nom&&m.nom)out.nom=m.nom;if((!out.cat||out.cat==='Outillage')&&m.cat)out.cat=m.cat;
    if(!out.echeance&&m.echeance)out.echeance=m.echeance;
    if((!out.etat||out.etat==='inconnu')&&m.etat&&m.etat!=='inconnu')out.etat=m.etat;
    if(m.presence==='confirme')out.presence='confirme';
    if(m.scan&&(!out.scan||new Date(m.scan)>new Date(out.scan)))out.scan=m.scan;
    out.verifLundi=newerObj(out.verifLundi,m.verifLundi);
    out.verifSemaine=newerObj(out.verifSemaine,m.verifSemaine);
    if(!out.controle2m&&m.controle2m)out.controle2m=m.controle2m;
  }
  return out;
}
function visibleCurrentRows(arr=S.mat||[]){const valid=new Set((S.chantiers||[]).map(c=>c.id));return arr.filter(m=>m?.chantierId&&valid.has(m.chantierId));}
function duplicateGroups(arr=S.mat||[]){
  const map=new Map();
  for(const m of visibleCurrentRows(arr)){const r=businessRef(m);if(!r)continue;const k=m.chantierId+'|'+r;if(!map.has(k))map.set(k,[]);map.get(k).push(m);}
  return [...map.entries()].filter(([,g])=>g.length>1).map(([key,group])=>({key,group,ref:businessRef(group[0]),chantierId:group[0].chantierId,extra:group.length-1}));
}
async function repairDuplicates(groups=duplicateGroups()){
  if(window.__v140Repairing)return {removed:0,groups:0};window.__v140Repairing=true;
  let removed=0,done=0,errors=[];
  try{
    for(const g of groups){
      const exact=g.group.find(m=>String(m.id)===g.ref);
      const keeper=exact||g.group.slice().sort((a,b)=>score(b)-score(a))[0];
      const merged=mergedKeeper(keeper,g.group);
      try{const {error}=await db.from('materiels').update(cleanDb(merged)).eq('id',keeper.id);if(error)throw error;Object.assign(keeper,merged);}catch(e){errors.push(`${g.ref}: ${e.message||e}`);continue;}
      for(const extra of g.group){if(extra.id===keeper.id)continue;
        try{await db.from('scans').update({materielId:keeper.id,chantierId:keeper.chantierId}).eq('materielId',extra.id);}catch(e){}
        try{const {error}=await db.from('materiels').delete().eq('id',extra.id);if(error)throw error;S.scans=(S.scans||[]).map(s=>s.materielId===extra.id?{...s,materielId:keeper.id,chantierId:keeper.chantierId}:s);S.mat=(S.mat||[]).filter(m=>m.id!==extra.id);removed++;}catch(e){errors.push(`${extra.id}: ${e.message||e}`);}
      }
      done++;
    }
    try{localStorage.setItem('ro3_m',JSON.stringify(S.mat));}catch(e){}
    if(typeof render==='function')render();setTimeout(decorate,30);
    return {removed,groups:done,errors};
  }finally{window.__v140Repairing=false;}
}
function showRepairOffer(){

function detectDpi(wb){

  let hi=-1,ref=-1,nom=-1,site=-1,cat=-1,date=-1;
  for(let i=0;i<Math.min(rows.length,30);i++){const h=(rows[i]||[]).map(x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim());const ri=h.findIndex(x=>x.includes('ref'));const si=h.findIndex(x=>x==='site'||x.includes('site'));if(ri>=0&&si>=0){hi=i;ref=ri;site=si;nom=h.findIndex(x=>x.includes('designation')||x.includes('materiel')||x.includes('libelle'));cat=h.findIndex(x=>x.includes('categorie')||x==='type');date=h.findIndex(x=>x.includes('validite')||x.includes('echeance'));break;}}
  if(hi<0)return null;const map=new Map();
  for(let i=hi+1;i<rows.length;i++){const r=rows[i]||[];const rr=normRef(r[ref]);if(!rr)continue;const st=canonSite(r[site]);if(!st)continue;map.set(rr,{reference:rr,nom:nom>=0?String(r[nom]||rr).trim():rr,cat:cat>=0?String(r[cat]||'Outillage').trim():'Outillage',echeance:date>=0?String(r[date]||'').trim():'',site:st});}

}

  const actual={};let total=0;for(const [site,count] of Object.entries(data.counts)){const c=childMap.get(siteKey(site));const n=new Set((S.mat||[]).filter(m=>m.chantierId===c.id).map(businessRef)).size;actual[site]=n;total+=n;}

  function siteOf(cid){const c=chantier(cid);return normSite(c?.nom||c?.lieu||cid);}
  function pathOf142(cid){

      const before=t.nodeValue||'';

    document.head.appendChild(st);
  }

  function schedule(){clearTimeout(timer);timer=setTimeout(apply,35);}
  window.RailOpsLifecycleV155.onMutation('v142-display',schedule);
  window.RailOpsLifecycleV155.afterRender('v142-display',()=>setTimeout(apply,25));
  setTimeout(apply,150);setTimeout(apply,1000);
  window.RailOpsDisplayV142={version:VERSION,apply,destinationsFor};
  console.info('[RailOps] affichage multi-chantier corrigé —',VERSION);
})();
</script>



<script id="railops-v145-generalized-register">
(function(){

function pathOf(cid){const c=chantier(cid);if(!c)return cid||'Chantier inconnu';const p=c.parent_id?chantier(c.parent_id):null;return p?`${p.nom} › ${c.nom}`:(c.nom||cid);}
function topMasterId(cid){let c=chantier(cid);if(!c)return cid;const seen=new Set();while(c?.parent_id&&!seen.has(c.id)){seen.add(c.id);const p=chantier(c.parent_id);if(!p)break;c=p;}return c?.id||cid;}
function activeChantiers(){return (state()?.chantiers||[]).filter(c=>c.statut!=='termine');}

function direct(ref,cid,rows=state()?.mat||[]){const r=normRef(ref);return rows.find(m=>m.chantierId===cid&&businessRef(m)===r)||null;}
function allByRef(ref,rows=state()?.mat||[]){const r=normRef(ref);return rows.filter(m=>businessRef(m)===r);}

function headerKind(v){
  const s=normText(v);if(!s)return '';
  if(/^(ref|reference|references|ref materiel|reference materiel|code|code materiel|identifiant)$/.test(s)||s.startsWith('ref '))return 'ref';
  if(/designation|libelle|materiel|article/.test(s)&&!/nombre|nb /.test(s))return 'name';
  if(/categorie|famille|type/.test(s))return 'cat';
  if(/validite|echeance|expiration|date limite|date valid/.test(s))return 'date';
  if(/^(site|zone|emplacement|affectation|sous chantier|sous chantier actuel|chantier|lieu)$/.test(s)||/site actuel|zone actuelle|sous chantier/.test(s))return 'site';
  return '';
}
function looksLikeRef(v){
  const raw=text(v);if(!raw||raw.length>90)return false;
  if(/^[📍📦↩]/u.test(raw))return false;
  if(/^.+\(\s*\d+\s*(?:articles?|materiels?|matériels?|references?|références?|items?)\s*\)\s*$/i.test(raw))return false;

}
function analyzeRows(rows){

    const row=Array.isArray(data[r])?data[r]:[];const kinds=row.map(headerKind);

}
function sectionCount(raw){const m=text(raw).match(/\(\s*(\d{1,5})\s*(?:articles?|materiels?|matériels?|references?|références?|items?|équipements?|equipements?)\s*\)/i);return m?Number(m[1]):0;}
function sourceDeclaredCount(rows,headerIdx){
  let top=0;
  const topLimit=headerIdx>=0?Math.min(rows.length,headerIdx):Math.min(rows.length,6);
  for(let r=0;r<topLimit;r++){
    const joined=(Array.isArray(rows[r])?rows[r]:[]).map(text).filter(Boolean).join(' | ');
    const ms=[...joined.matchAll(/(\d{1,5})\s*(?:articles?|materiels?|matériels?|references?|références?)/gi)].map(m=>Number(m[1])).filter(Boolean);

  for(const row of rows){const vals=(Array.isArray(row)?row:[]).map(text).filter(Boolean);if(vals.length!==1)continue;const n=sectionCount(vals[0]);if(n){sections+=n;sectionRows++;}}

  const sheets=(wb.SheetNames||[]).map(name=>{

}

}

  return `<div class=\"ro144-source ${q.ok?'ok':'bad'}\"><div><strong>${esc(sheet.name)}</strong> · ${sheet.items.length} référence(s)${decl}</div><div class=\"ro144-muted\">${sheet.ignored.length} ligne(s) ignorée(s) · ${sheet.duplicates.length} doublon(s) interne(s)${sheet.analysis.siteCol>=0?` · ${sheet.siteValues.length} emplacement(s)`:''}</div>${q.reasons.length?`<div class=\"ro144-danger\">${q.reasons.map(esc).join('<br>')}</div>`:''}</div>`;

function plannedTargetId(p){return p.cid||`__NEW__${p.parentId||'ROOT'}__${siteKey(p.name)}`;}
function currentRefSet(cid){return new Set((state()?.mat||[]).filter(m=>m.chantierId===cid).map(businessRef).filter(Boolean));}
function analyzePlan(plan,sourceSheets,mode){

}

function hash(v){let h=2166136261;for(const ch of String(v??'')){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}return (h>>>0).toString(36).toUpperCase();}
function freshId(ref,cid,used,blocked){const base=normRef(ref).slice(0,72);let id='';do{id=`${base}${MC}${Date.now().toString(36).toUpperCase()}${(++seq).toString(36).toUpperCase()}${hash(cid+seq).slice(0,5)}`.slice(0,120);}while(used.has(id)||blocked.has(id));used.add(id);return id;}
function cleanDb(m){return {id:m.id,nom:m.nom||'',cat:m.cat||'Outillage',chantierId:m.chantierId,etat:m.etat||'inconnu',scan:m.scan||null,presence:m.presence||'non-confirme',echeance:m.echeance||'',verifLundi:m.verifLundi||null,verifSemaine:m.verifSemaine||null,controle2m:m.controle2m||null};}
async function createChantier(name,parentId=null){
  const s=state();const key=siteKey(name);const existing=(s.chantiers||[]).find(c=>c.statut!=='termine'&&(c.parent_id||null)===(parentId||null)&&siteKey(c.nom)===key);if(existing)return existing;
  const id=typeof newId==='function'?newId('CH'):`CH${Date.now()}${(++seq).toString(36)}`;const c={id,nom:text(name)||'Nouveau chantier',lieu:text(name)||'',chef:s.agent||'',chefs:s.agent?[s.agent]:[],statut:'actif',desc:parentId?'Sous-chantier créé lors d’un import registre':'Chantier créé lors d’un import registre',dateDebut:'',dateFin:'',agents:[],tournees:[],parent_id:parentId||null,jourReset:1,responsableSemaine:null};
  const payload={id:c.id,nom:c.nom,lieu:c.lieu,chef:c.chef,chefs:c.chefs,statut:c.statut,desc:c.desc,dateDebut:'',dateFin:'',agents:[],tournees:[],parent_id:c.parent_id};const {error}=await db.from('chantiers').upsert([payload],{onConflict:'id'});if(error)throw error;s.chantiers.push(c);try{localStorage.setItem('ro3_c',JSON.stringify(s.chantiers));}catch(e){}return c;

async function updateMeta(m,item,targetCid){const patch={};if(item.nom)patch.nom=item.nom;if(item.cat)patch.cat=item.cat;if(item.echeance)patch.echeance=item.echeance;if(targetCid&&m.chantierId!==targetCid)patch.chantierId=targetCid;if(!Object.keys(patch).length)return;const {error}=await db.from('materiels').update(patch).eq('id',m.id);if(error)throw error;Object.assign(m,patch);}
async function ensureOccurrence(item,targetCid,parentId,mode,rows,used,blocked){

async function tombstoneIds(ids){

    const rawAfter=await readRaw();
    const tomb=await readTombstones();

    window.__RailOpsV146Last=report;

}
function schedule(ms=120){clearTimeout(scheduled);scheduled=setTimeout(()=>enforceIntegrity({silent:true}),ms);}

})();
</script>

function prog148(label,n,total,p){return `<div class="ro148-prog"><div class="ro148-prog-h"><span>${label}</span><strong>${n}/${total} · ${p}%</strong></div><div class="ro148-track"><div class="ro148-fill" style="width:${Math.max(0,Math.min(100,p))}%"></div></div></div>`;}
function card148(c,child=false){const x=stats148(c);return `<button class="ro148-card" onclick="RailOpsRole148.open('${esc148(c.id)}')"><div class="ro148-cardtop"><div><div class="ro148-name">${esc148(c.nom||'Chantier')}</div><div class="ro148-sub">${esc148(c.lieu||'')}${child?' · Sous-chantier':' · Chef d’équipe : '+esc148(chef148(c))}</div></div><span class="ro148-count">${x.total} suivis</span></div>${prog148('Vérification 1',x.v1,x.total,x.p1)}${prog148('Vérification 2',x.v2,x.total,x.p2)}</button>`;}
function group148(list){
  const map=new Map();
  for(const c of list){const k=chef148(c);if(!map.has(k))map.set(k,[]);map.get(k).push(c);}
  return [...map.entries()].sort((a,b)=>a[0].localeCompare(b[0],'fr')).map(([chef,chs])=>`<section class="ro148-group"><div class="ro148-group-h"><div class="ro148-avatar">${esc148((chef.match(/\b\p{L}/gu)||['?']).slice(0,2).join('').toUpperCase())}</div><div><strong>${esc148(chef)}</strong><span>${chs.length} chantier(s)</span></div></div>${chs.sort((a,b)=>String(a.nom||'').localeCompare(String(b.nom||''),'fr')).map(c=>card148(c,false)).join('')}</section>`).join('');
}
function renderDashboard148(root){
  const masters=masterActive148();
  const sums=masters.reduce((a,c)=>{const x=stats148(c);a.total+=x.total;a.v1+=x.v1;a.v2+=x.v2;return a;},{total:0,v1:0,v2:0});
  const p1=sums.total?Math.round(sums.v1/sums.total*100):0;
  const p2=sums.total?Math.round(sums.v2/sums.total*100):0;
  root.innerHTML=`<div class="topbar"><div class="tbi"><div class="tbt">Vue globale des vérifications</div><div class="tbs">${masters.length} chantier(s) maître(s)</div></div><div class="avatar" onclick="openProfil()" style="cursor:pointer">${esc148((S.agent||'?').slice(0,2).toUpperCase())}</div></div><div class="ro148-wrap"><div class="ro148-summary"><div><strong>${masters.length}</strong><span>Chantiers</span></div><div><strong>${p1}%</strong><span>Vérif. 1</span></div><div><strong>${p2}%</strong><span>Vérif. 2</span></div></div><div class="ro148-note">Les sous-chantiers sont regroupés sous leur chantier maître et ne sont plus comptés comme des chantiers indépendants.</div><div class="ro148-title">Par chef d'équipe</div>${masters.length?group148(masters):'<div class="ro148-empty">Aucun chantier actif</div>'}</div>`;
}
function renderDetail148(){
  const root=document.getElementById('app');if(!root)return;
  const c=cById148(S.curC);if(!c){S.page='dashboard';return render();}
  const x=stats148(c);const kids=children148(c.id);
  root.innerHTML=`<div class="topbar"><button class="ro148-back" onclick="RailOpsRole148.back()">‹</button><div class="tbi"><div class="tbt">${esc148(c.nom||'Chantier')}</div><div class="tbs">${esc148(c.lieu||'')} · Chef d’équipe : ${esc148(chef148(c))}</div></div></div><div class="ro148-wrap"><div class="ro148-note">Vue d’avancement uniquement · aucune référence matériel n’est affichée.</div><div class="ro148-big"><div><strong>${x.p1}%</strong><span>Vérification 1</span></div><div><strong>${x.p2}%</strong><span>Vérification 2</span></div></div>${prog148('Vérification 1',x.v1,x.total,x.p1)}${prog148('Vérification 2',x.v2,x.total,x.p2)}${kids.length?`<div class="ro148-title">Sous-chantiers</div>${kids.map(k=>card148(k,true)).join('')}`:''}</div>`;
}

// Interception directe du routeur : évite que l'ancien tableau Chef de chantier
// puisse reprendre la main, quelle que soit la page utilisée.
const basePgDash148=typeof pgDash==='function'?pgDash:null;
if(basePgDash148){pgDash=function(root){if(isCC148())return renderDashboard148(root);return basePgDash148.apply(this,arguments);};}
const basePgChantiers148=typeof pgChantiers==='function'?pgChantiers:null;
if(basePgChantiers148){pgChantiers=function(root){if(isCC148())return renderDashboard148(root);return basePgChantiers148.apply(this,arguments);};}
const baseDetail148=typeof renderChantierDetail==='function'?renderChantierDetail:null;
if(baseDetail148){renderChantierDetail=function(){if(isCC148())return renderDetail148();return baseDetail148.apply(this,arguments);};}
const baseOpen148=typeof openC==='function'?openC:null;
if(baseOpen148){openC=function(id){if(isCC148()){const c=cById148(id);if(!c)return;S.curC=id;S.page='chantier_detail';return render();}return baseOpen148.apply(this,arguments);};}

const css=document.createElement('style');css.id='ro148-style';css.textContent=`
.ro148-wrap{padding:12px 16px 90px}.ro148-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.ro148-summary>div,.ro148-big>div{background:var(--bg2);border:.5px solid var(--border);border-radius:12px;padding:12px;text-align:center}.ro148-summary strong,.ro148-big strong{display:block;font-size:22px;color:var(--accent)}.ro148-summary span,.ro148-big span{display:block;font-size:10px;color:var(--text3);margin-top:3px}.ro148-big{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.ro148-note{background:rgba(55,138,221,.08);border:.5px solid rgba(55,138,221,.22);border-radius:10px;padding:9px 11px;font-size:11px;color:var(--text2);margin-bottom:12px}.ro148-title{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin:14px 2px 8px}.ro148-group{margin-bottom:14px}.ro148-group-h{display:flex;align-items:center;gap:8px;background:var(--bg2);border:.5px solid var(--border);border-radius:11px;padding:9px 10px;margin-bottom:7px}.ro148-group-h strong{display:block;font-size:12px}.ro148-group-h span{display:block;font-size:9px;color:var(--text3);margin-top:2px}.ro148-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg3);font-size:10px;color:var(--accent);font-weight:700}.ro148-card{display:block;width:100%;text-align:left;background:var(--bg2);color:var(--text);border:.5px solid var(--border);border-radius:12px;padding:11px 12px;margin-bottom:7px;cursor:pointer}.ro148-cardtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:9px}.ro148-name{font-size:13px;font-weight:650}.ro148-sub{font-size:9px;color:var(--text3);margin-top:2px}.ro148-count{font-size:9px;color:var(--text2);background:var(--bg3);padding:3px 7px;border-radius:999px;white-space:nowrap}.ro148-prog{margin:7px 0}.ro148-prog-h{display:flex;justify-content:space-between;font-size:9px;color:var(--text2);margin-bottom:4px}.ro148-prog-h strong{font-weight:650;color:var(--text)}.ro148-track{height:5px;background:var(--bg3);border-radius:999px;overflow:hidden}.ro148-fill{height:100%;background:var(--accent);border-radius:999px}.ro148-empty{text-align:center;color:var(--text3);padding:45px 10px}.ro148-back{border:0;background:none;color:var(--text);font-size:28px;padding:0 8px 0 0;cursor:pointer}
`;document.head.appendChild(css);

window.RailOpsRole148={version:VERSION,masters:masterActive148,stats:stats148,open(id){if(!isCC148())return;const c=cById148(id);if(!c)return;S.curC=id;S.page='chantier_detail';render();},back(){S.curC=null;S.page='dashboard';render();}};
console.info('[RailOps] vue Chef de chantier maîtres uniquement —',VERSION);
})();
</script>


<script id="railops-v149-archive-obsoletes">
(function(){
'use strict';
const VERSION='149-archivage-obsoletes-exclusion-globale';
// Migration ponctuelle validée le 21/08/2026 : ces IDs sont les anciennes structures
// confirmées comme obsolètes. Ce ne sont PAS des règles métier basées sur leurs noms.
const CONFIRMED_OBSOLETE_ROOTS=['CH384853','CH3402791']; // LGV historique + chantier test "new"
const MIGRATION_KEY='ro_v149_archived_confirmed_roots_v1';

function state149(){try{return S||null;}catch(e){return null;}}
function allC149(){return Array.isArray(state149()?.chantiers)?state149().chantiers:[];}
function c149(id){return allC149().find(c=>String(c.id)===String(id))||null;}
function inactiveStatus149(v){const s=String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();return s==='termine'||s==='archive'||s==='archivee';}
function activeTree149(cid){
  let c=c149(cid),seen=new Set();
  while(c){
    const id=String(c.id);if(seen.has(id))return false;seen.add(id);
    if(inactiveStatus149(c.statut))return false;
    if(!c.parent_id)return true;
    c=c149(c.parent_id);
  }
  return false;
}
function descendants149(rootId){
  const out=[],seen=new Set(),q=[String(rootId)];
  while(q.length){const id=q.shift();if(seen.has(id))continue;seen.add(id);const c=c149(id);if(c)out.push(c);for(const x of allC149())if(String(x.parent_id||'')===id)q.push(String(x.id));}
  return out;
}
function operationalIds149(){return new Set(allC149().filter(c=>activeTree149(c.id)).map(c=>String(c.id)));}
function saveLocal149(){try{localStorage.setItem('ro3_c',JSON.stringify(allC149()));}catch(e){}}
function notify149(msg,type='ok'){try{if(typeof toast==='function')toast(msg,type);}catch(e){}}

async function persistArchive149(rows){
  const errors=[];
  for(const c of rows){
    try{
      const r=await db.from('chantiers').update({statut:'termine'}).eq('id',c.id);
      if(r?.error)errors.push(`${c.nom||c.id}: ${r.error.message||r.error}`);
    }catch(e){errors.push(`${c.nom||c.id}: ${e.message||e}`);}
  }
  return errors;
}

async function archiveConfirmed149(options={}){
  const s=state149();if(!s||!allC149().length)return {changed:0,ids:[],errors:[]};
  const rows=[];const seen=new Set();
  for(const root of CONFIRMED_OBSOLETE_ROOTS){for(const c of descendants149(root)){if(seen.has(String(c.id)))continue;seen.add(String(c.id));if(!inactiveStatus149(c.statut))rows.push(c);}}
  if(!rows.length){try{localStorage.setItem(MIGRATION_KEY,'done');}catch(e){}return {changed:0,ids:[...seen],errors:[]};}

  // Optimistic local archive for immediate UI consistency; no material or scan is deleted.
  const stamp=new Date().toISOString();
  for(const c of rows){c.statut='termine';if(!c.dateTermine)c.dateTermine=stamp;}
  saveLocal149();
  const errors=await persistArchive149(rows);
  if(errors.length){
    console.warn('[RailOps v149] archivage partiel',errors);
    notify149(`Archivage incomplet : ${errors.length} chantier(s) n'ont pas été confirmé(s) par la base.`,'danger');
  }else{
    try{localStorage.setItem(MIGRATION_KEY,'done');}catch(e){}
    if(!options.silent)notify149(`${rows.length} ancienne(s) structure(s) archivée(s) · aucune donnée supprimée.`,'ok');
  }
  try{window.RailOpsDisplayV142?.apply?.();}catch(e){}
  try{if(typeof render==='function')render();}catch(e){}
  return {changed:rows.length,ids:rows.map(c=>c.id),errors};
}

// Operational hardening: a direct material/QR access may never reopen an archived branch.
try{
  const oldGetM149=typeof getM==='function'?getM:null;
  if(oldGetM149){getM=function(id){const m=oldGetM149.call(this,id);if(!m)return null;if(state149()?.role==='admin')return m;return activeTree149(m.chantierId)?m:null;};window.getM=getM;}
}catch(e){}
try{
  const oldOpenC149=typeof openC==='function'?openC:null;
  if(oldOpenC149){openC=function(id){if(state149()?.role!=='admin'&&!activeTree149(id)){notify149('Ce chantier est archivé et n’est plus opérationnel.','danger');return;}return oldOpenC149.apply(this,arguments);};window.openC=openC;}
}catch(e){}
try{
  const oldMatOfC149=typeof matOfC==='function'?matOfC:null;
  if(oldMatOfC149){matOfC=function(cid){if(state149()?.role!=='admin'&&!activeTree149(cid))return [];return oldMatOfC149.apply(this,arguments);};window.matOfC=matOfC;}
}catch(e){}

// The Chef de chantier can only open active branches, including through the v148 helper object.
try{
  if(window.RailOpsRole148){
    const oldOpenObj149=window.RailOpsRole148.open;
    window.RailOpsRole148.open=function(id){if(!activeTree149(id)){notify149('Ce chantier est archivé.','danger');return;}return oldOpenObj149?.call(this,id);};
  }
}catch(e){}

// Archive after every successful load so Supabase is the authority and old local caches cannot revive these roots.
window.RailOpsLifecycleV155.afterLoad('v149-archive',()=>archiveConfirmed149({silent:true}));

window.RailOpsArchive149={version:VERSION,activeTree:activeTree149,operationalIds:operationalIds149,archiveConfirmed:()=>archiveConfirmed149({silent:false}),roots:[...CONFIRMED_OBSOLETE_ROOTS]};
setTimeout(()=>archiveConfirmed149({silent:true}),500);
setTimeout(()=>archiveConfirmed149({silent:true}),1600);
setTimeout(()=>archiveConfirmed149({silent:true}),4000);
console.info('[RailOps] archivage obsolètes + exclusion opérationnelle actif —',VERSION);
})();
</script>


<script id="railops-v153-auth-session-fix">
(function(){
'use strict';
const VERSION='153-auth-session-fix';
async function railopsAuthenticatedLogin(){
  const login=String(document.getElementById('ln')?.value||'').trim();
  const password=String(document.getElementById('lp')?.value||'');
  if(!login||!password){toast('Veuillez renseigner votre nom ou badge et votre mot de passe','danger');return;}
  const btn=document.querySelector('#app button[onclick*="doLogin"]');
  const oldText=btn?.textContent||'';
  if(btn){btn.disabled=true;btn.textContent='Connexion…';}
  try{
    const {data,error}=await db.functions.invoke('railops-auth-bridge',{body:{login,password}});
    if(error||!data?.ok||!data?.session?.access_token||!data?.session?.refresh_token){
      console.warn('[RailOps auth]',error||data?.code||'AUTH_FAILED');
      toast('Identifiant ou mot de passe incorrect','danger');return;
    }
    const {error:sessionError}=await db.auth.setSession({access_token:data.session.access_token,refresh_token:data.session.refresh_token});
    if(sessionError)throw sessionError;
    const {data:authCheck,error:authError}=await db.auth.getUser();
    if(authError||!authCheck?.user)throw authError||new Error('Session Supabase non établie');
    const profile=data.profile||{};
    if(!profile.nom||!profile.role)throw new Error('Profil RailOps incomplet');
    localStorage.removeItem('ro3_c');localStorage.removeItem('ro3_m');localStorage.removeItem('ro3_u');
    S.agent=profile.nom;S.role=profile.role;S.page='dashboard';
    localStorage.setItem('ro3_a',JSON.stringify({agent:S.agent,role:S.role}));
    await load();render();setupRealtime();setTimeout(flushOfflineQueue,2000);
  }catch(err){console.error('[RailOps auth] connexion impossible',err);toast('Connexion impossible. Réessayez dans quelques instants.','danger');}
  finally{if(btn&&document.contains(btn)){btn.disabled=false;btn.textContent=oldText||'Se connecter';}}
}
doLogin=railopsAuthenticatedLogin;
window.RailOpsAuthFix={version:VERSION,login:railopsAuthenticatedLogin};
console.info('[RailOps] Correctif Auth actif —',VERSION);
})();
</script>

<script id="railops-inventory-responsible-label">
(function(){
'use strict';
const VERSION='155-inventory-label-normalizer';

function normalizeTextNode(node){
  const before=node.nodeValue||'';
  let after=before.replace(/RESPONSABLE\s+INVENTAIRE\s*4\b/gi,'RESPONSABLE INVENTAIRE');
  after=after.replace(/Responsable\s+semaine\s*:/gi,'RESPONSABLE INVENTAIRE :');
  if(after!==before)node.nodeValue=after;
}

function normalizeInventoryLabels(){
  try{
    const root=document.getElementById('app')||document.body;
    if(!root)return;

    // Le libellé parasite exact peut provenir d'un nœud texte ou de deux enfants voisins.
    const all=Array.from(root.querySelectorAll('*'));
    for(const el of all){
      const txt=(el.textContent||'').replace(/\s+/g,' ').trim();
      if(/^RESPONSABLE INVENTAIRE\s*4$/i.test(txt)){
        el.textContent='RESPONSABLE INVENTAIRE';
      }
    }

    // L'ancien libellé « Responsable semaine » n'est renommé que dans les cartes Inventaire.
    const cards=Array.from(root.querySelectorAll('.card')).filter(card=>{
      const title=(card.querySelector('h3')?.textContent||'').trim();
      const txt=(card.textContent||'').replace(/\s+/g,' ').trim();
      return /^Inventaire$/i.test(title)||/Avancement inventaire/i.test(txt)||/RESPONSABLE INVENTAIRE/i.test(txt);
    });
    for(const card of cards){
      const walker=document.createTreeWalker(card,NodeFilter.SHOW_TEXT);
      let node;
      while((node=walker.nextNode()))normalizeTextNode(node);
    }
  }catch(e){}
}

let timer=null;
function schedule(){clearTimeout(timer);timer=setTimeout(normalizeInventoryLabels,20);}

window.RailOpsLifecycleV155.afterRender('inventory-label',schedule);
window.RailOpsLifecycleV155.onMutation('inventory-label',schedule);
setTimeout(normalizeInventoryLabels,50);
setTimeout(normalizeInventoryLabels,500);

window.RailOpsInventoryLabelV155={version:VERSION,apply:normalizeInventoryLabels};
console.info('[RailOps] libellé responsable inventaire corrigé —',VERSION);
})();
</script>
