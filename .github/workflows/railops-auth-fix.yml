name: RailOps auth fix

on:
  push:
    paths:
      - '.github/workflows/railops-auth-fix.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch login to establish Supabase session
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = 'railops-v153-auth-session-fix'
          if marker in text:
              print('Auth patch already present')
              raise SystemExit(0)

          patch = r'''
<script id="railops-v153-auth-session-fix">
/* RailOps v153 — connexion via Edge Function + vraie session Supabase Auth.
   Les mots de passe ne sont plus lus ni compares depuis public.users. */
(function(){
'use strict';
const VERSION='153-auth-session-fix';

async function railopsAuthenticatedLogin(){
  const login=String(document.getElementById('ln')?.value||'').trim();
  const password=String(document.getElementById('lp')?.value||'');
  if(!login||!password){
    toast('Veuillez renseigner votre nom ou badge et votre mot de passe','danger');
    return;
  }

  const btn=document.querySelector('#app button[onclick*="doLogin"]');
  const oldText=btn?.textContent||'';
  if(btn){btn.disabled=true;btn.textContent='Connexion…';}

  try{
    const {data,error}=await db.functions.invoke('railops-auth-bridge',{
      body:{login,password}
    });
    if(error||!data?.ok||!data?.session?.access_token||!data?.session?.refresh_token){
      console.warn('[RailOps auth]',error||data?.code||'AUTH_FAILED');
      toast('Identifiant ou mot de passe incorrect','danger');
      return;
    }

    const {error:sessionError}=await db.auth.setSession({
      access_token:data.session.access_token,
      refresh_token:data.session.refresh_token
    });
    if(sessionError) throw sessionError;

    // Vérifie que le client courant porte réellement le JWT avant tout chargement métier.
    const {data:authCheck,error:authError}=await db.auth.getUser();
    if(authError||!authCheck?.user) throw authError||new Error('Session Supabase non établie');

    const profile=data.profile||{};
    if(!profile.nom||!profile.role) throw new Error('Profil RailOps incomplet');

    // Supprime uniquement les caches métier locaux : la session Supabase Auth reste persistée.
    localStorage.removeItem('ro3_c');
    localStorage.removeItem('ro3_m');
    localStorage.removeItem('ro3_u');
    S.agent=profile.nom;
    S.role=profile.role;
    S.page='dashboard';
    localStorage.setItem('ro3_a',JSON.stringify({agent:S.agent,role:S.role}));

    await load();
    render();
    setupRealtime();
    setTimeout(flushOfflineQueue,2000);
  }catch(err){
    console.error('[RailOps auth] connexion impossible',err);
    toast('Connexion impossible. Réessayez dans quelques instants.','danger');
  }finally{
    if(btn&&document.contains(btn)){btn.disabled=false;btn.textContent=oldText||'Se connecter';}
  }
}

doLogin=railopsAuthenticatedLogin;
window.RailOpsAuthFix={version:VERSION,login:railopsAuthenticatedLogin};
console.info('[RailOps] Correctif Auth actif —',VERSION);
})();
</script>
'''

          pos = text.lower().rfind('</body>')
          if pos < 0:
              raise SystemExit('Closing </body> not found')
          text = text[:pos] + patch + '\n' + text[pos:]
          path.write_text(text, encoding='utf-8')
          print('Auth patch injected')
          PY
      - name: Sanity checks
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          checks={
            'single auth patch': text.count('id="railops-v153-auth-session-fix"') == 1,
            'bridge invoked': "db.functions.invoke('railops-auth-bridge'" in text,
            'session installed': 'db.auth.setSession({' in text,
            'auth verified': 'db.auth.getUser()' in text,
            'legacy password comparison not in patch': "profile.mdp" not in text[text.index('railops-v153-auth-session-fix'):],
          }
          for name,ok in checks.items(): print(('PASS' if ok else 'FAIL'),name)
          if not all(checks.values()): raise SystemExit(1)
          PY
      - name: Commit patched index
        run: |
          git config user.name 'railops-bot'
          git config user.email 'railops-bot@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: establish Supabase session before loading RailOps data' || exit 0
          git push
