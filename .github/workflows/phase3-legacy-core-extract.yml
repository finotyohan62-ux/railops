name: RailOps phase 3 legacy core extraction
on:
  push:
    branches:
      - refactor/modules-progressive-offline-legacy-core
    paths:
      - scripts/extract-legacy-core-phase3.js
      - .github/workflows/phase3-legacy-core-extract.yml
permissions:
  contents: write
jobs:
  extract-legacy-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/modules-progressive-offline-legacy-core
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract historical core verbatim
        run: node scripts/extract-legacy-core-phase3.js
      - name: Verify module extraction regression
        run: node tests/modules-refactor.test.js
      - name: Verify shared lifecycle regression
        run: node tests/lifecycle-refactor.test.js
      - name: Verify legacy core extraction regression
        run: node tests/legacy-core-extraction.test.js
      - name: Commit extracted core and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/extract-legacy-core-phase3.js .github/workflows/phase3-legacy-core-extract.yml
          git add index.html js/legacy-core.js
          git commit -m "refactor: extract historical RailOps core"
          git push origin HEAD:refactor/modules-progressive-offline-legacy-core
