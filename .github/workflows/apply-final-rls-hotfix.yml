name: Apply final RLS hotfix

on:
  push:
    branches:
      - hotfix/final-rls-writes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch live material and user write paths
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('js/legacy-core.js')
          s=p.read_text(encoding='utf-8')
          pattern=re.compile(r"async function saveMat\(a\)\{.*?\}async function saveChantier",re.S)
          repl="async function saveMat(a){const b=S.mat.find(c=>c.id===a);if(!b)return;try{localStorage.setItem('ro3_m',JSON.stringify(S.mat));await roPersistMaterial(b);}catch(h){toast('Erreur réseau article','danger');}}async function saveChantier"
          s,count=pattern.subn(repl,s,count=1)
          if count!=1: raise SystemExit(f'saveMat replacement count={count}')
          if "if(i!==-0x1)saveMat(S['curM'])" not in s:
              raise SystemExit('live scan does not route through saveMat')

          generic_users="if(S[aC(0x20a)]['length'])await db[aC(0x432)](aC(0x20a))['upsert'](S[aC(0x20a)],{'onConflict':'id'});"
          if generic_users in s:
              s=s.replace(generic_users,'',1)
          if generic_users in s:
              raise SystemExit('generic users upsert still present')

          bootstrap_users="if(!v||!v['length'])await db[aM(0x432)]('users')[aM(0x33d)](S[aM(0x20a)],{'onConflict':'id'});"
          if bootstrap_users in s:
              s=s.replace(bootstrap_users,'',1)
          p.write_text(s,encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="js/core/secure-admin.js?v=157"></script>'
          if tag not in s:
              marker='<script id="railops-v155-lifecycle" src="./js/core/lifecycle.js"></script>'
              if marker not in s: raise SystemExit('lifecycle script marker not found')
              s=s.replace(marker,marker+'\n'+tag,1)
          p.write_text(s,encoding='utf-8')
      - name: Run focused regressions
        run: |
          node tests/final-agent-material-save.test.js
          node tests/final-secure-user-admin.test.js
      - name: Remove one-shot patch workflow and commit
        shell: bash
        run: |
          rm .github/workflows/apply-final-rls-hotfix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/legacy-core.js index.html .github/workflows/apply-final-rls-hotfix.yml
          git commit -m 'fix: finalize production RLS write paths'
          git push origin HEAD:hotfix/final-rls-writes
