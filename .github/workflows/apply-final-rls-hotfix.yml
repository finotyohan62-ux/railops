name: Diagnose final live material path

on:
  push:
    branches:
      - hotfix/final-rls-writes

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Locate live material persistence
        shell: python
        run: |
          from pathlib import Path
          s=Path('js/legacy-core.js').read_text(encoding='utf-8')
          for needle in ['materielId','findIndex','onConflict']:
              print('===',needle,'===')
              pos=0
              count=0
              while True:
                  i=s.find(needle,pos)
                  if i<0: break
                  count+=1
                  print(f'[{count}]',s[max(0,i-350):min(len(s),i+650)])
                  pos=i+len(needle)
              print('count=',count)
