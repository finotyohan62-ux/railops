name: v150B-2B checks

on:
  push:
    branches:
      - security/v150b2b-rls-ready
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: v150b2b-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run v150B-2B verification suite
        run: node tests/run-v150b2b-checks.js
