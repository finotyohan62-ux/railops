name: v150B-2B checks

on:
  push:
    branches:
      - security/v150b2b-rls-ready
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: v150b2b-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Report branch drift (non-blocking)
        if: github.event_name == 'push'
        continue-on-error: true
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          read -r behind ahead <<< "$(git rev-list --left-right --count origin/main...HEAD)"
          main_sha="$(git rev-parse --short=12 origin/main)"
          head_sha="$(git rev-parse --short=12 HEAD)"
          merge_base_sha="$(git merge-base origin/main HEAD | cut -c1-12)"
          merge_base_date="$(git show -s --format=%cI "${merge_base_sha}")"
          main_only_file_count="$(git diff --name-only HEAD..origin/main | wc -l | tr -d ' ')"
          main_only_commit_count="$(git rev-list --count HEAD..origin/main)"
          main_only_files="$(git diff --name-only HEAD..origin/main | head -n 20)"
          main_only_commits="$(git log --oneline --no-decorate HEAD..origin/main | head -n 12)"
          echo "ℹ branch drift against main: behind=${behind} ahead=${ahead} main=${main_sha} branch=${head_sha} merge-base=${merge_base_sha} date=${merge_base_date}"
          {
            echo "## Branch drift diagnostic"
            echo ""
            echo "- Behind main: **${behind}** commit(s)"
            echo "- Ahead of main: **${ahead}** commit(s)"
            echo "- Main-only changed file count: **${main_only_file_count}**"
            echo "- Main-only commit count: **${main_only_commit_count}**"
            printf '%s\n' "- Main SHA: **\`${main_sha}\`**"
            printf '%s\n' "- Branch SHA: **\`${head_sha}\`**"
            printf '%s\n' "- Merge base: **\`${merge_base_sha}\`**"
            printf '%s\n' "- Merge-base date: **${merge_base_date}**"
            echo "- Branch drift is informational only; no merge or rebase is performed."
            echo ""
            echo "### Main-only changed files (up to 20):"
            if [ -n "${main_only_files}" ]; then
              while IFS= read -r file; do
                printf '%s\n' "- \`${file}\`"
              done <<< "${main_only_files}"
            else
              echo "- None"
            fi
            echo ""
            echo "### Main-only commits (up to 12):"
            if [ -n "${main_only_commits}" ]; then
              while IFS= read -r commit; do
                printf '%s\n' "- \`${commit}\`"
              done <<< "${main_only_commits}"
            else
              echo "- None"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run v150B-2B verification suite
        run: node tests/run-v150b2b-checks.js
