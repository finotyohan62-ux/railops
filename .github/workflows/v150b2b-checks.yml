name: v150B-2B checks

on:
  push:
    branches:
      - security/v150b2b-rls-ready
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: v150b2b-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Report branch drift (non-blocking)
        if: github.event_name == 'push'
        continue-on-error: true
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          read -r behind ahead <<< "$(git rev-list --left-right --count origin/main...HEAD)"
          echo "ℹ branch drift against main: behind=${behind} ahead=${ahead}"
          {
            echo "## Branch drift diagnostic"
            echo ""
            echo "- Behind main: **${behind}** commit(s)"
            echo "- Ahead of main: **${ahead}** commit(s)"
            echo "- Branch drift is informational only; no merge or rebase is performed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run v150B-2B verification suite
        run: node tests/run-v150b2b-checks.js
