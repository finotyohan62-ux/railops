name: Finalize v155 lifecycle refactor

on:
  push:
    branches:
      - refactor/v155-lifecycle-cleanup

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, '[v155-finalize]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v155 refactor
        run: python scripts/v155_refactor.py
      - name: Verify regression invariants
        run: node tests/lifecycle-refactor.test.js
      - name: Commit index refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "refactor: centralize RailOps lifecycle hooks in v155"
          git push
