name: v155 action smoke

on:
  push:
    branches:
      - refactor/v155-lifecycle-cleanup

permissions:
  contents: write

jobs:
  smoke:
    if: contains(github.event.head_commit.message, '[v155-smoke]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit smoke marker
        shell: bash
        run: |
          echo "actions-write-ok" > v155-action-smoke.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v155-action-smoke.txt
          git commit -m "test: confirm action write access"
          git push
