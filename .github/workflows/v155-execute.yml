name: Execute v155 lifecycle refactor

on:
  push:
    branches:
      - refactor/v155-lifecycle-cleanup

permissions:
  contents: write

jobs:
  execute:
    if: contains(github.event.head_commit.message, '[v155-execute]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: RED - legacy architecture must fail
        shell: bash
        run: |
          set +e
          node tests/lifecycle-refactor.test.js
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::Regression test unexpectedly passed before refactor"
            exit 1
          fi
          echo "RED confirmed"

      - name: Apply refactor
        run: python scripts/v155_refactor.py

      - name: GREEN - refactored architecture must pass
        run: node tests/lifecycle-refactor.test.js

      - name: Verify preserved modules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks={
            'v155 lifecycle':s.count('id="railops-v155-lifecycle"')==1,
            'one observer':s.count('new MutationObserver(')==1,
            'v140 engine':'railops-v140-clean-engine' in s,
            'v142 display':"142-affichage-multichantier" in s,
            'v145 register':'railops-v145-generalized-register' in s,
            'v146 integrity':'railops-v146-integrity-invariant' in s,
            'v147 roles':'railops-v147-roles' in s,
            'v149 archive':'railops-v149-archive-obsoletes' in s,
            'v153 auth':'railops-v153-auth-session-fix' in s,
            'inventory normalizer':'railops-inventory-responsible-label' in s,
          }
          for name,ok in checks.items():print(('OK  ' if ok else 'FAIL')+name)
          failed=[name for name,ok in checks.items() if not ok]
          if failed:raise SystemExit('Failed: '+', '.join(failed))
          PY

      - name: Commit verified refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/v155-execute.yml .github/workflows/v155-one-shot-refactor.yml scripts/v155_refactor.py
          git commit -m "refactor: centralize RailOps lifecycle hooks in v155"
          git push
