name: RailOps auth diagnostic

on:
  push:
    paths:
      - '.github/workflows/railops-auth-diagnostic.yml'

permissions:
  contents: write

jobs:
  extract-auth-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract auth context
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          needles = ['hashMdp', 'ro3_a', 'Connexion', 'connexion', 'password', 'type="password"']
          chunks=[]
          for needle in needles:
              start=0
              while True:
                  i=text.find(needle,start)
                  if i < 0: break
                  a=max(0,i-4500); b=min(len(text),i+6500)
                  chunks.append(f'\n===== {needle} @ {i} =====\n{text[a:b]}\n')
                  start=i+len(needle)
          Path('railops-auth-context.txt').write_text(''.join(chunks), encoding='utf-8')
          print(f'extracted {len(chunks)} context block(s)')
          PY
      - name: Commit diagnostic context
        run: |
          git config user.name 'railops-bot'
          git config user.email 'railops-bot@users.noreply.github.com'
          git add railops-auth-context.txt
          git commit -m 'chore: extract auth context' || exit 0
          git push
