name: Append RailOps worklog 2026-08-25 14:20

on:
  push:
    branches:
      - security/v150b2b-rls-ready
    paths:
      - .github/workflows/append-worklog-20260825-1420.yml

permissions:
  contents: write

jobs:
  append:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append verified worklog entry
        shell: bash
        run: |
          printf '\n' >> docs/worklog-railops.md
          cat docs/worklog-railops-append/2026-08-25-1420.md >> docs/worklog-railops.md
          rm .github/workflows/append-worklog-20260825-1420.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/worklog-railops.md .github/workflows/append-worklog-20260825-1420.yml
          git commit -m 'docs: append RailOps 14:20 worklog entry'
          git push origin HEAD:security/v150b2b-rls-ready
