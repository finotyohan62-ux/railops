name: RailOps modules regression
on:
  push:
    branches:
      - refactor/modules-progressive-offline-css
      - refactor/modules-progressive-offline
      - refactor/modules-progressive-offline-sync
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  modules-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check module extraction invariants
        run: node tests/modules-refactor.test.js
      - name: Check shared lifecycle invariants
        run: node tests/lifecycle-refactor.test.js
      - name: Check secure scoped load
        run: node tests/secure-load.test.js
      - name: Check Admin mode toggle
        run: node tests/admin-mode.test.js
      - name: Check legacy core extraction invariants
        run: node tests/legacy-core-extraction.test.js
      - name: Check offline sync extraction invariants
        run: node tests/sync-extraction.test.js
      - name: Check multi-chantier source reconciliation
        run: node tests/multichantier-source-reconciliation.test.js
      - name: Check adaptive register reader
        run: node tests/register-adaptive-reader.test.js
      - name: Check adaptive register integration
        run: node tests/register-import-adaptive-integration.test.js
      - name: Check sync status UI diagnostics
        run: node tests/sync-status-ui.test.js
      - name: Check visual refresh phase 1
        run: node tests/visual-refresh-phase1.test.js
      - name: Check visual refresh phase 2 inventory
        run: node tests/visual-refresh-phase2-inventory.test.js
      - name: Check visual refresh phase 3 scanner
        run: node tests/visual-refresh-phase3-scanner.test.js
      - name: Check visual refresh phase 4 chantier
        run: node tests/visual-refresh-phase4-chantier.test.js
      - name: Check visual refresh phase 5 admin
        run: node tests/visual-refresh-phase5-admin.test.js
      - name: Check visual refresh phase 6 finishing
        run: node tests/visual-refresh-phase6-finishing.test.js
      - name: Check offline sync server acknowledgement handling
        run: node tests/sync-error-handling.test.js
