name: RailOps modules regression
on:
  push:
    branches:
      - refactor/modules-progressive-offline-css
      - refactor/modules-progressive-offline
      - fix/iphone-safari-layout-v1
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  modules-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check module extraction invariants
        run: node tests/modules-refactor.test.js
      - name: Check iPhone layout invariants
        run: node tests/iphone-layout-regression.test.js
      - name: Check shared lifecycle invariants
        run: node tests/lifecycle-refactor.test.js
