name: RailOps phase 2 lifecycle extraction
on:
  push:
    branches:
      - refactor/modules-progressive-offline-lifecycle
    paths:
      - scripts/extract-lifecycle-phase2.js
      - .github/workflows/phase2-lifecycle-extract.yml
permissions:
  contents: write
jobs:
  extract-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/modules-progressive-offline-lifecycle
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract shared lifecycle core
        run: node scripts/extract-lifecycle-phase2.js
      - name: Verify module extraction regression
        run: node tests/modules-refactor.test.js
      - name: Verify shared lifecycle regression
        run: node tests/lifecycle-refactor.test.js
      - name: Commit extracted lifecycle core
        run: |
          if git diff --quiet -- index.html js/core/lifecycle.js; then
            echo "No lifecycle extraction changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/core/lifecycle.js
          git commit -m "refactor: extract shared lifecycle core"
          git push origin HEAD:refactor/modules-progressive-offline-lifecycle
