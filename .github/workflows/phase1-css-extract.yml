name: RailOps phase 1 CSS extraction
on:
  push:
    branches:
      - refactor/modules-progressive-offline-css
    paths:
      - scripts/extract-css-phase1.js
      - .github/workflows/phase1-css-extract.yml
permissions:
  contents: write
jobs:
  extract-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/modules-progressive-offline-css
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract application stylesheet
        run: node scripts/extract-css-phase1.js
      - name: Verify module extraction regression
        run: node tests/modules-refactor.test.js
      - name: Verify shared lifecycle regression
        run: node tests/lifecycle-refactor.test.js
      - name: Commit extracted stylesheet
        run: |
          if git diff --quiet -- index.html css/railops.css; then
            echo "No CSS extraction changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html css/railops.css
          git commit -m "refactor: extract RailOps stylesheet"
          git push origin HEAD:refactor/modules-progressive-offline-css
